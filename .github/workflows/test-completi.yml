# Test completi nel browser (circa 20-30 minuti). Si avviano a mano da GitHub: Actions -> Test completi -> Run workflow.
name: Test completi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sorgente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node strumenti/verifica.mjs
      - run: node strumenti/test.mjs --paralleli=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-test
          path: sorgente/dist/test-log/
