      <section class="card" data-panel="pagine">
        <h2>Disposizione delle pagine</h2>
        <p class="hint">Trascina le righe o usa le frecce per cambiare l'ordine. Con la casella decidi se la pagina compare nel fascicolo.</p>
        <div id="order-list"></div>
        <label class="f">Prodotti per pagina
          <select id="s-playout">
            <option value="flow">Continuo (tutti di seguito)</option>
            <option value="two">2 prodotti per pagina</option>
            <option value="one">1 prodotto per pagina, foto grande</option>
          </select>
        </label>
        <h3>Pagine libere</h3>
        <p class="hint">Aggiungi pagine tue: lavori già realizzati, referenze, foto di cantiere, note.</p>
        <div class="lines" id="clist"></div>
        <div class="row"><button class="btn sm" id="c-add" type="button">+ Pagina libera</button></div>
      </section>
