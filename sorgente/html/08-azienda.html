      <section class="card" data-panel="azienda">
        <h2>Azienda</h2>
        <p class="warn">Testi e contatti precompilati con le informazioni del sito iecisrlmatera.it: controlla che siano aggiornati prima di inviare il documento.</p>
        <h3>Contatti</h3>
        <div class="grid2">
          <label class="f">Email<input type="email" data-b="company.email" data-after="invio"></label>
          <label class="f">Sito web<input type="text" data-b="company.web" data-after="invio"></label>
          <label class="f">WhatsApp principale (con prefisso)<input type="tel" data-b="company.wa" data-after="invio"></label>
          <label class="f">WhatsApp secondo numero<input type="tel" data-b="company.wa2" data-after="invio"></label>
          <label class="f">Pagina Facebook<textarea rows="1" class="t1" inputmode="url" autocapitalize="off" spellcheck="false" data-b="company.fb"></textarea></label>
          <label class="f">Profilo Instagram<textarea rows="1" class="t1" inputmode="url" autocapitalize="off" spellcheck="false" data-b="company.ig"></textarea></label>
        </div>
        <label class="f">Slogan<textarea rows="1" class="t1" id="p-slogan" data-pr="slogan"></textarea></label>
        <label class="f">Chi siamo<textarea id="p-about" data-pr="about" style="min-height:110px"></textarea></label>
        <label class="f">Numeri (una riga ciascuno: valore | etichetta)<textarea id="p-stats" data-pr="stats"></textarea></label>
        <label class="f">Abilitazioni e certificazioni (una per riga)<textarea id="p-certs" data-pr="certs"></textarea></label>
        <label class="f">Come lavoriamo (una riga per fase: titolo | descrizione)<textarea id="p-steps" data-pr="steps" style="min-height:110px"></textarea></label>
        <label class="f">Garanzie (una per riga)<textarea id="p-guar" data-pr="guar"></textarea></label>
      </section>
